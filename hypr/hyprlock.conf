# tams-shell — layar kunci (hyprlock). Dipanggil lewat Super+L / Power.lock().
# Wallpaper mengikuti wallpaper desktop (atau Settings.lockWallpaper bila diisi), lewat symlink
# ~/.config/tams/lock yang dijaga service LockWallpaper. Jadi ganti wallpaper = ganti lock juga.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.config/tams/lock
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    brightness = 0.70
    contrast = 0.95
    vibrancy = 0.15
}

# Jam besar, tipis — gaya bersih.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 118
    font_family = Inter Light
    color = rgba(255, 255, 255, 0.96)
    position = 0, 150
    halign = center
    valign = center
}

# Tanggal.
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    font_size = 20
    font_family = Inter
    color = rgba(255, 255, 255, 0.68)
    position = 0, 58
    halign = center
    valign = center
}

# Kolom kata sandi: pil membulat, kaca.
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    rounding = 27
    outer_color = rgba(255, 255, 255, 0.30)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(255, 255, 255, 0.96)
    placeholder_text = <span foreground="##ffffffb0">kata sandi</span>
    fail_text = <span foreground="##ffb3b3">salah, coba lagi</span>
    check_color = rgba(255, 255, 255, 0.55)
    fail_color = rgba(220, 110, 130, 0.85)
    position = 0, -130
    halign = center
    valign = center
}
