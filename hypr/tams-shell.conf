# tams-shell untuk Hyprland (config format .conf).
# Dipasang install.sh ke ~/.config/hypr/tams-shell.conf dan dimuat dari hyprland.conf dengan:
#   source = ~/.config/hypr/tams-shell.conf

exec-once = qs -c tams

bind = SUPER, Space, global, tams:launcher
bind = SUPER, A, global, tams:dashboard
bind = SUPER, I, global, tams:settings
bind = SUPER, Escape, global, tams:settings
bind = SUPER, slash, global, tams:keys
